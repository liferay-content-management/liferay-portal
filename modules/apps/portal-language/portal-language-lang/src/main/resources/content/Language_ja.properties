stage-1-role-help=これは、<em>ページの管理</em> 権限をもつユーザーにより構成されるステージ 1です。この許可を持つユーザーは誰でも、<em>内容変更の申請</em> をワークフローに登録できます。
stage-2-role-help=<strong>ステージ 2</strong> のロールは、少なくとも、<em>申請の許可</em>、<em>承認者の割り当て</em> 、<em>ページの管理</em> の許可をメンバーに対して与えます。また個別の要求に対して権限を追加します。
stage-last-role-help=<strong>ラストステージ</strong>のロールは、少なくとも <em>申請の許可</em>、<em>ページの管理</em> 、 <em>ステージの公開</em> 許可をメンバーに対して与えます。 また個別の要求に対して権限を追加します。
stage-organization-permissions-reference-help=以下に参照された許可は組織のリソースを参照します。<em>エンタープライスの管理 &raquo; ロール &raquo; <strong>ある組織のロール</strong> &raquo; アクション &raquo; 権限の定義 &raquo; ポートレット許可の追加 &raquo; エンタープライズの管理 &raquo; 組織</em> を参照してください。
stage-review-role-help=<strong>レビューステージ</strong> 内のロールは、少なくとも <em>申請の承認</em> の許可はメンバに対して許可します。個人の要求に対して、さらに許可を追加します。
